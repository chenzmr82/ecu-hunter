name: Daily ECU search

on:
  schedule:
    - cron: "39 5 * * *"   # 06:39 Madrid in winter, 07:39 in summer (GitHub cron is UTC)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-search
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2 requests==2.32.3 beautifulsoup4==4.12.3
      - name: Collect listings (Ovoko, B-Parts, eBay API if keys are set)
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python collector/collect.py
      - name: Tests and build
        run: |
          python pipeline/test_pipeline.py
          python pipeline/build.py
          python pipeline/report.py
      - name: Commit the new run
        run: |
          git config user.name "ecu-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs/*.json
          git commit -m "Daily run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push
      - name: Post daily report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-report --color 6d28d9 --description "Informe diario" 2>/dev/null || true
          n=$(gh issue list --label daily-report --state open --json number -q '.[0].number')
          if [ -z "$n" ]; then
            n=$(gh issue create --title "Informe diario ECU" --label daily-report \
                 --body "Un comentario por búsqueda diaria. Página: https://chenzmr82.github.io/ecu-hunter/" | grep -o '[0-9]*$')
          fi
          gh issue comment "$n" --body-file report.md

  publish:
    needs: collect
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
